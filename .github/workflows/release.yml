# Attaches the plugin package to a release when it's published. Publish the release yourself
# (e.g. `gh release create v0.2.0 --notes "..."`): the axidps registry only lists releases
# published by the plugin's owner or a maintainer, not by github-actions.
name: Package

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("axidps-plugin.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match manifest version $version"
            exit 1
          fi

      - name: Test
        run: node --test

      - name: Zip the plugin
        run: zip -X -q tag-colours.zip axidps-plugin.json README.md LICENSE settings.html tags.js

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" tag-colours.zip --clobber -R "$GITHUB_REPOSITORY"
